/text><polyline class="e-broken" points="860,212 735,286" marker-end="url(#sq-links-en-m-broken)"/><text class="t to" x="930" y="240" font-size="13" font-weight="600" text-anchor="start">NOMER: 100% found</text><text class="t to" x="930" y="260" font-size="13" font-weight="400" text-anchor="start">answers unlinked (synthetic)</text><text class="t to" x="930" y="280" font-size="13" font-weight="400" text-anchor="start">→ regional shares only</text><polyline class="e-key" points="600,530 600,406" marker-end="url(#sq-links-en-m-key)"/><text class="t t2" x="588" y="500" font-size="13" font-weight="400" text-anchor="end">NOMER: 100% found, region agrees 100%</text><polyline class="e-region" points="910,530 749,382"/><text class="t t3" x="905" y="452" font-size="13" font-weight="400" text-anchor="start">region TE and quarter only</text><text class="t t3" x="905" y="472" font-size="13" font-weight="400" text-anchor="start">the decoder compares how codes behave</text><rect class="call" x="40" y="330" width="384" height="134" rx="12"/><text class="t " x="58" y="360" font-size="15" font-weight="600" text-anchor="start">Household-by-household check (2024)</text><text class="t t2" x="58" y="386" font-size="13" font-weight="400" text-anchor="start">Child in D-008, but &#x27;no children&#x27; in D-002:</text><text class="t to" x="58" y="414" font-size="15" font-weight="600" text-anchor="start">Almaty city: 322 of 348 (92.5%)</text><text class="t to" x="58" y="440" font-size="15" font-weight="600" text-anchor="start">Ulytau: 250 of 273 (91.6%)</text><polyline class="e-ok" points="40,520 84,520"/><text class="t t2" x="96" y="525" font-size="13" font-weight="400" text-anchor="start">record link works</text><polyline class="e-broken" points="40,548 84,548"/><text class="t t2" x="96" y="553" font-size="13" font-weight="400" text-anchor="start">key exists, answers unlinked → regions</text><polyline class="e-key" points="40,576 84,576"/><text class="t t2" x="96" y="581" font-size="13" font-weight="400" text-anchor="start">key exists, no comparison yet</text><polyline class="e-region" points="40,604 84,604"/><text class="t t2" x="96" y="609" font-size="13" font-weight="400" text-anchor="start">region only</text></svg>