<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Одно домохозяйство — один номер во всех формах. NOMER связывает Д-002, Д-004, Д-006 и Д-008; Т-001 связана только регионом." class="sq-diagram"><defs><marker id="sq-links-ru-m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sq-links-ru-m-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-key" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sq-links-ru-m-broken" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-broken" d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="t " x="40" y="46" font-size="26" font-weight="600" text-anchor="start">Одно домохозяйство — один номер во всех формах</text><text class="t t3" x="40" y="74" font-size="15" font-weight="400" text-anchor="start">NOMER связывает Д-002, Д-004, Д-006 и Д-008; Т-001 связана только регионом</text><rect class="hub" x="455" y="290" width="290" height="112" rx="12"/><text class="t " x="600.0" y="324" font-size="17" font-weight="600" text-anchor="middle">Д-008 · контрольная карточка</text><text class="t t2" x="600.0" y="352" font-size="14" font-weight="400" text-anchor="middle">12 000 домохозяйств · 41 821 человек</text><text class="t tb" x="600.0" y="378" font-size="13" font-weight="400" text-anchor="middle">ключ NOMER + NOMP (человек)</text><rect class="box" x="40" y="120" width="330" height="168" rx="12"/><text class="t " x="58" y="152" font-size="17" font-weight="600" text-anchor="start">Д-002 · качество жизни</text><text class="t t2" x="58" y="176" font-size="13" font-weight="400" text-anchor="start">11 931 домохозяйств, один респондент</text><rect class="sunk" x="58" y="192" width="134" height="34" rx="6"/><text class="t " x="125" y="214" font-size="14" font-weight="400" text-anchor="middle">subject</text><rect class="sunk" x="218" y="192" width="134" height="34" rx="6"/><text class="t " x="285" y="214" font-size="14" font-weight="400" text-anchor="middle">ocenka</text><polyline class="e-key" points="192,209 218,209"/><text class="t t2" x="58" y="252" font-size="13" font-weight="400" text-anchor="start">один человек? расходится: </text><text class="t to" x="58" y="272" font-size="13" font-weight="600" text-anchor="start">2022: 0, 2023: 328, 2024: 32</text><rect class="box" x="830" y="120" width="330" height="92" rx="12"/><text class="t " x="848" y="154" font-size="17" font-weight="600" text-anchor="start">Д-006 · основное интервью</text><text class="t t2" x="848" y="180" font-size="13" font-weight="400" text-anchor="start">11 704 домохозяйств · жильё, удобства</text><rect class="box" x="400" y="530" width="400" height="110" rx="12"/><text class="t " x="418" y="562" font-size="17" font-weight="600" text-anchor="start">Д-004 · квартальный журнал</text><text class="t t2" x="418" y="588" font-size="13" font-weight="400" text-anchor="start">kv_vopr0: визит × квартал (48 000)</text><text class="t t2" x="418" y="612" font-size="13" font-weight="400" text-anchor="start">+ 11 таблиц строк расходов (2 104 382 строк)</text><rect class="island" x="850" y="530" width="310" height="110" rx="12"/><text class="t " x="868" y="562" font-size="17" font-weight="600" text-anchor="start">Т-001 · обследование занятости</text><text class="t t2" x="868" y="588" font-size="13" font-weight="400" text-anchor="start">469 352 респондентов</text><text class="t to" x="868" y="612" font-size="13" font-weight="600" text-anchor="start">нет номера домохозяйства</text><polyline class="e-ok" points="370,272 451,336" marker-end="url(#sq-links-ru-m-ok)"/><text class="t tb" x="398" y="258" font-size="13" font-weight="600" text-anchor="start">NOMER + NOMP: найдено 100%, пол совпадает 100%</text><text class="t tb" x="398" y="278" font-size="13" font-weight="400" text-anchor="start">ответы согласованы: «есть дети» 86% против 7%</text><polyline class="e-broken" points="860,212 735,286" marker-end="url(#sq-links-ru-m-broken)"/><text class="t to" x="930" y="240" font-size="13" font-weight="600" text-anchor="start">NOMER: найдено 100%</text><text class="t to" x="930" y="260" font-size="13" font-weight="400" text-anchor="start">ответы не связаны (синтетика)</text><text class="t to" x="930" y="280" font-size="13" font-weight="400" text-anchor="start">→ только доли по регионам</text><polyline class="e-key" points="600,530 600,406" marker-end="url(#sq-links-ru-m-key)"/><text class="t t2" x="588" y="500" font-size="13" font-weight="400" text-anchor="end">NOMER: найдено 100%, регион совпадает 100%</text><polyline class="e-region" points="910,530 749,382"/><text class="t t3" x="905" y="452" font-size="13" font-weight="400" text-anchor="start">только регион TE и квартал</text><text class="t t3" x="905" y="472" font-size="13" font-weight="400" text-anchor="start">декодер сравнивает поведение кодов</text><rect class="call" x="40" y="330" width="384" height="134" rx="12"/><text class="t " x="58" y="360" font-size="15" font-weight="600" text-anchor="start">Проверка по каждому домохозяйству (2024)</text><text class="t t2" x="58" y="386" font-size="13" font-weight="400" text-anchor="start">Ребёнок в Д-008, но в Д-002 «нет детей»:</text><text class="t to" x="58" y="414" font-size="15" font-weight="600" text-anchor="start">г. Алматы — 322 из 348 (92,5%)</text><text class="t to" x="58" y="440" font-size="15" font-weight="600" text-anchor="start">Улытау — 250 из 273 (91,6%)</text><polyline class="e-ok" points="40,520 84,520"/><text class="t t2" x="96" y="525" font-size="13" font-weight="400" text-anchor="start">связь по записям работает</text><polyline class="e-broken" points="40,548 84,548"/><text class="t t2" x="96" y="553" font-size="13" font-weight="400" text-anchor="start">ключ есть, ответы не связаны → регионы</text><polyline class="e-key" points="40,576 84,576"/><text class="t t2" x="96" y="581" font-size="13" font-weight="400" text-anchor="start">ключ есть, сравнений пока нет</text><polyline class="e-region" points="40,604 84,604"/><text class="t t2" x="96" y="609" font-size="13" font-weight="400" text-anchor="start">только регион</text></svg>