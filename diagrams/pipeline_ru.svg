<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Что инструмент читает и что выдаёт. каждое число в сводке и делах посчитано кодом по записям, не языковой моделью." class="sq-diagram"><style>
.t { font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; fill: #18202b; }
.t2 { fill: #47505e; } .t3 { fill: #6a7381; } .tb { fill: #2a6fd6; } .to { fill: #9a4313; }
.box { fill: #ffffff; stroke: #c3cbd7; stroke-width: 1.2; }
.sunk { fill: #eef1f5; stroke: none; }
.hub { fill: #dce8fa; stroke: #2a6fd6; stroke-width: 1.6; }
.call { fill: #fbe7dc; stroke: #d96a33; stroke-width: 1.4; }
.island { fill: #ffffff; stroke: #6a7381; stroke-width: 1.2; stroke-dasharray: 5 4; }
.e-ok { stroke: #2a6fd6; stroke-width: 2.6; fill: none; }
.e-broken { stroke: #d96a33; stroke-width: 2.2; stroke-dasharray: 8 5; fill: none; }
.e-key { stroke: #47505e; stroke-width: 1.6; fill: none; }
.e-region { stroke: #6a7381; stroke-width: 1.6; stroke-dasharray: 2 4; fill: none; }
.e-flow { stroke: #47505e; stroke-width: 1.6; fill: none; }
.m-ok { fill: #2a6fd6; } .m-key { fill: #47505e; } .m-broken { fill: #d96a33; }
</style><defs><marker id="sq-pipe-ru-m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sq-pipe-ru-m-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-key" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sq-pipe-ru-m-broken" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-broken" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="560" fill="#ffffff"/><text class="t " x="28" y="46" font-size="26" font-weight="600" text-anchor="start">Что инструмент читает и что выдаёт</text><text class="t t3" x="28" y="74" font-size="15" font-weight="400" text-anchor="start">каждое число в сводке и делах посчитано кодом по записям, не языковой моделью</text><rect class="box" x="28" y="120" width="164" height="100" rx="10"/><text class="t " x="42" y="152" font-size="17" font-weight="600" text-anchor="start">Документы</text><text class="t t2" x="42" y="178" font-size="13" font-weight="400" text-anchor="start">бланк, инструкция,</text><text class="t t2" x="42" y="198" font-size="13" font-weight="400" text-anchor="start">структура файлов</text><rect class="hub" x="224" y="120" width="164" height="100" rx="10"/><text class="t " x="238" y="152" font-size="17" font-weight="600" text-anchor="start">Правила</text><text class="t t2" x="238" y="178" font-size="13" font-weight="400" text-anchor="start">173 правила</text><text class="t t2" x="238" y="198" font-size="13" font-weight="400" text-anchor="start">каждое с цитатой</text><rect class="box" x="420" y="120" width="164" height="100" rx="10"/><text class="t " x="434" y="152" font-size="17" font-weight="600" text-anchor="start">Проверки</text><text class="t t2" x="434" y="178" font-size="13" font-weight="400" text-anchor="start">каждое правило</text><text class="t t2" x="434" y="198" font-size="13" font-weight="400" text-anchor="start">по регионам и годам</text><rect class="hub" x="616" y="120" width="164" height="100" rx="10"/><text class="t " x="630" y="152" font-size="17" font-weight="600" text-anchor="start">Сводка</text><text class="t t2" x="630" y="178" font-size="13" font-weight="400" text-anchor="start">94 проблемы</text><text class="t t2" x="630" y="198" font-size="13" font-weight="400" text-anchor="start">регион × форма × год</text><rect class="box" x="812" y="120" width="164" height="100" rx="10"/><text class="t " x="826" y="152" font-size="17" font-weight="600" text-anchor="start">Дела</text><text class="t t2" x="826" y="178" font-size="13" font-weight="400" text-anchor="start">10 дел:</text><text class="t t2" x="826" y="198" font-size="13" font-weight="400" text-anchor="start">причина, исправление</text><rect class="box" x="1008" y="120" width="164" height="100" rx="10"/><text class="t " x="1022" y="152" font-size="17" font-weight="600" text-anchor="start">Консоль</text><text class="t t2" x="1022" y="178" font-size="13" font-weight="400" text-anchor="start">карта, досье,</text><text class="t t2" x="1022" y="198" font-size="13" font-weight="400" text-anchor="start">правила в SQL</text><polyline class="e-flow" points="194,170.0 220,170.0" marker-end="url(#sq-pipe-ru-m-key)"/><polyline class="e-flow" points="390,170.0 416,170.0" marker-end="url(#sq-pipe-ru-m-key)"/><polyline class="e-flow" points="586,170.0 612,170.0" marker-end="url(#sq-pipe-ru-m-key)"/><polyline class="e-flow" points="782,170.0 808,170.0" marker-end="url(#sq-pipe-ru-m-key)"/><polyline class="e-flow" points="978,170.0 1004,170.0" marker-end="url(#sq-pipe-ru-m-key)"/><text class="t tb" x="208.0" y="162.0" font-size="11" font-weight="600" text-anchor="middle">LLM</text><rect class="call" x="224" y="270" width="164" height="84" rx="10"/><text class="t " x="238" y="300" font-size="15" font-weight="600" text-anchor="start">SQL для базы Бюро</text><text class="t t2" x="238" y="324" font-size="13" font-weight="400" text-anchor="start">141 правил,</text><text class="t t2" x="238" y="342" font-size="13" font-weight="400" text-anchor="start">каждый квартал</text><polyline class="e-flow" points="306.0,222 306.0,266" marker-end="url(#sq-pipe-ru-m-key)"/><rect class="box" x="616" y="270" width="164" height="84" rx="10"/><text class="t " x="630" y="300" font-size="15" font-weight="600" text-anchor="start">ML-сравнения</text><text class="t t2" x="630" y="324" font-size="13" font-weight="400" text-anchor="start">регион, год, форма</text><text class="t t2" x="630" y="342" font-size="13" font-weight="400" text-anchor="start">без правил</text><rect class="box" x="812" y="270" width="164" height="84" rx="10"/><text class="t " x="826" y="300" font-size="15" font-weight="600" text-anchor="start">Декодер кодов</text><text class="t t2" x="826" y="324" font-size="13" font-weight="400" text-anchor="start">значения кодов</text><text class="t t2" x="826" y="342" font-size="13" font-weight="400" text-anchor="start">и их сдвиги</text><polyline class="e-flow" points="698.0,270 698.0,224" marker-end="url(#sq-pipe-ru-m-key)"/><polyline class="e-flow" points="842,270 760,224" marker-end="url(#sq-pipe-ru-m-key)"/><rect class="sunk" x="420" y="420" width="556" height="46" rx="8"/><text class="t t2" x="698.0" y="449" font-size="14" font-weight="600" text-anchor="middle">Записи Д-002…Д-008, Т-001</text><polyline class="e-flow" points="502.0,420 502.0,224" marker-end="url(#sq-pipe-ru-m-key)"/><polyline class="e-flow" points="698.0,420 698.0,358" marker-end="url(#sq-pipe-ru-m-key)"/><polyline class="e-flow" points="894.0,420 894.0,358" marker-end="url(#sq-pipe-ru-m-key)"/><rect class="sunk" x="28" y="420" width="360" height="112" rx="10"/><text class="t " x="42" y="446" font-size="14" font-weight="600" text-anchor="start">Точность извлечения правил (Д-002)</text><text class="t t2" x="42" y="466" font-size="13" font-weight="400" text-anchor="start">точность 99,2%, полнота 94,8%</text><text class="t " x="42" y="496" font-size="14" font-weight="600" text-anchor="start">Доказательство</text><text class="t t2" x="42" y="516" font-size="13" font-weight="400" text-anchor="start">500 прогонов с подложенными ошибками</text></svg>