<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="What the tool reads and what it writes. every number in the scorecard and the case files is computed from the records by code, not by the language model." class="sq-diagram"><defs><marker id="sq-pipe-en-m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sq-pipe-en-m-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-key" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sq-pipe-en-m-broken" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-broken" d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="t " x="28" y="46" font-size="26" font-weight="600" text-anchor="start">What the tool reads and what it writes</text><text class="t t3" x="28" y="74" font-size="15" font-weight="400" text-anchor="start">every number in the scorecard and the case files is computed from the records by code, not by the language model</text><rect class="box" x="28" y="120" width="164" height="100" rx="10"/><text class="t " x="42" y="152" font-size="17" font-weight="600" text-anchor="start">Documents</text><text class="t t2" x="42" y="178" font-size="13" font-weight="400" text-anchor="start">form, instruction,</text><text class="t t2" x="42" y="198" font-size="13" font-weight="400" text-anchor="start">file structure</text><rect class="hub" x="224" y="120" width="164" height="100" rx="10"/><text class="t " x="238" y="152" font-size="17" font-weight="600" text-anchor="start">Rules</text><text class="t t2" x="238" y="178" font-size="13" font-weight="400" text-anchor="start">173 rules</text><text class="t t2" x="238" y="198" font-size="13" font-weight="400" text-anchor="start">each with a quote</text><rect class="box" x="420" y="120" width="164" height="100" rx="10"/><text class="t " x="434" y="152" font-size="17" font-weight="600" text-anchor="start">Checks</text><text class="t t2" x="434" y="178" font-size="13" font-weight="400" text-anchor="start">every rule</text><text class="t t2" x="434" y="198" font-size="13" font-weight="400" text-anchor="start">by region and year</text><rect class="hub" x="616" y="120" width="164" height="100" rx="10"/><text class="t " x="630" y="152" font-size="17" font-weight="600" text-anchor="start">Scorecard</text><text class="t t2" x="630" y="178" font-size="13" font-weight="400" text-anchor="start">94 issues</text><text class="t t2" x="630" y="198" font-size="13" font-weight="400" text-anchor="start">region × form × year</text><rect class="box" x="812" y="120" width="164" height="100" rx="10"/><text class="t " x="826" y="152" font-size="17" font-weight="600" text-anchor="start">Case files</text><text class="t t2" x="826" y="178" font-size="13" font-weight="400" text-anchor="start">10 case files:</text><text class="t t2" x="826" y="198" font-size="13" font-weight="400" text-anchor="start">cause, fix</text><rect class="box" x="1008" y="120" width="164" height="100" rx="10"/><text class="t " x="1022" y="152" font-size="17" font-weight="600" text-anchor="start">Console</text><text class="t t2" x="1022" y="178" font-size="13" font-weight="400" text-anchor="start">map, dossiers,</text><text class="t t2" x="1022" y="198" font-size="13" font-weight="400" text-anchor="start">rules as SQL</text><polyline class="e-flow" points="194,170.0 220,170.0" marker-end="url(#sq-pipe-en-m-key)"/><polyline class="e-flow" points="390,170.0 416,170.0" marker-end="url(#sq-pipe-en-m-key)"/><polyline class="e-flow" points="586,170.0 612,170.0" marker-end="url(#sq-pipe-en-m-key)"/><polyline class="e-flow" points="782,170.0 808,170.0" marker-end="url(#sq-pipe-en-m-key)"/><polyline class="e-flow" points="978,170.0 1004,170.0" marker-end="url(#sq-pipe-en-m-key)"/><text class="t tb" x="208.0" y="162.0" font-size="11" font-weight="600" text-anchor="middle">LLM</text><rect class="call" x="224" y="270" width="164" height="84" rx="10"/><text class="t " x="238" y="300" font-size="15" font-weight="600" text-anchor="start">SQL for the Bureau</text><text class="t t2" x="238" y="324" font-size="13" font-weight="400" text-anchor="start">141 rules,</text><text class="t t2" x="238" y="342" font-size="13" font-weight="400" text-anchor="start">rerun every quarter</text><polyline class="e-flow" points="306.0,222 306.0,266" marker-end="url(#sq-pipe-en-m-key)"/><rect class="box" x="616" y="270" width="164" height="84" rx="10"/><text class="t " x="630" y="300" font-size="15" font-weight="600" text-anchor="start">ML comparisons</text><text class="t t2" x="630" y="324" font-size="13" font-weight="400" text-anchor="start">region, year, form</text><text class="t t2" x="630" y="342" font-size="13" font-weight="400" text-anchor="start">no rules needed</text><rect class="box" x="812" y="270" width="164" height="84" rx="10"/><text class="t " x="826" y="300" font-size="15" font-weight="600" text-anchor="start">Code decoder</text><text class="t t2" x="826" y="324" font-size="13" font-weight="400" text-anchor="start">code meanings</text><text class="t t2" x="826" y="342" font-size="13" font-weight="400" text-anchor="start">and code shifts</text><polyline class="e-flow" points="698.0,270 698.0,224" marker-end="url(#sq-pipe-en-m-key)"/><polyline class="e-flow" points="842,270 760,224" marker-end="url(#sq-pipe-en-m-key)"/><rect class="sunk" x="420" y="420" width="556" height="46" rx="8"/><text class="t t2" x="698.0" y="449" font-size="14" font-weight="600" text-anchor="middle">Records D-002…D-008, T-001</text><polyline class="e-flow" points="502.0,420 502.0,224" marker-end="url(#sq-pipe-en-m-key)"/><polyline class="e-flow" points="698.0,420 698.0,358" marker-end="url(#sq-pipe-en-m-key)"/><polyline class="e-flow" points="894.0,420 894.0,358" marker-end="url(#sq-pipe-en-m-key)"/><rect class="sunk" x="28" y="420" width="360" height="112" rx="10"/><text class="t " x="42" y="446" font-size="14" font-weight="600" text-anchor="start">Rule extraction accuracy (D-002)</text><text class="t t2" x="42" y="466" font-size="13" font-weight="400" text-anchor="start">precision 99.2%, recall 94.8%</text><text class="t " x="42" y="496" font-size="14" font-weight="600" text-anchor="start">Proof</text><text class="t t2" x="42" y="516" font-size="13" font-weight="400" text-anchor="start">500 runs with planted errors</text></svg>